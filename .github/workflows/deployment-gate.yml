name: Deployment gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-card-detail-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
